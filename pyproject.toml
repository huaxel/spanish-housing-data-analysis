[project]
name = "spanish-housing-data-analysis"
version = "0.1.0"
description = "Evolution of Spanish housing prices vs built stock and population/households (2001–2025). Evidence + DuckDB + Parquet."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "pyarrow>=17.0.0",
    "openpyxl>=3.1.0",
    "xlrd==2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spanish_housing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM117"]

[tool.ruff.lint.per-file-ignores]
# render_preview.py embeds an HTML/SVG template; wrapping template lines
# would damage the readability of the web source, not Python.
"scripts/render_preview.py" = ["E501"]
